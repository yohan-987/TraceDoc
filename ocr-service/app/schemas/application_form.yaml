docType: application_form
schemaVersion: "1"
fields:
  - name: full_name
    semanticType: person_name
    normalizer: text
    validators: [person_name]
    strategies:
      - kind: anchor
        anchors: ["full name(?: of (?:the )?applicant)?", "name of (?:the )?applicant", "applicant'?s? name", "^name(?=\\s*(?:[:\\-]|$))",
                  "applicant(?=\\s*[:\\-])"]
        confidence: 0.90

  - name: id_number
    semanticType: id_number
    normalizer: id
    validators:
      - {name: regex, pattern: "^(?=.*[0-9])[A-Za-z0-9][A-Za-z0-9\\-]{4,24}$"}
    strategies:
      - kind: anchor
        anchors: ["id (?:number|no\\.?)", "identity (?:number|no\\.?)", "card (?:number|no\\.?)", "document (?:number|no\\.?)"]
        confidence: 0.92

  - name: dob
    semanticType: dob
    normalizer: date
    validators: [date]
    strategies:
      - kind: anchor
        anchors: ["date of birth", "birth date", "dob"]
        pattern: "@date"
        confidence: 0.92

  - name: address_permanent
    semanticType: address_permanent
    normalizer: text
    validators: [address]
    continuationLines: 2
    strategies:
      - kind: anchor
        anchors: ["permanent address", "address \\(permanent\\)", "residential address", "^address(?=\\s*(?:[:\\-]|$))"]
        confidence: 0.88

  - name: address_current
    semanticType: address_current
    normalizer: text
    validators: [address]
    continuationLines: 2
    strategies:
      - kind: anchor
        anchors: ["current address", "present address", "address \\(current\\)", "mailing address",
                  "correspondence address"]
        confidence: 0.88

  - name: requested_amount
    semanticType: requested_amount
    normalizer: amount
    validators: [amount]
    strategies:
      - kind: anchor
        anchors: ["requested (?:loan )?amount", "amount requested", "loan amount", "amount applied for"]
        pattern: "@amount"
        pick: first
        confidence: 0.92

  - name: application_date
    semanticType: application_date
    normalizer: date
    validators: [date]
    strategies:
      - kind: anchor
        anchors: ["application date", "date of application", "^date(?=\\s*(?:[:\\-]|$))"]
        pattern: "@date"
        confidence: 0.85

  - name: signature            # a region observation only: no text is read and no claim is made about the signature
    semanticType: signature_region
    normalizer: none
    validators: []
    strategies:
      - kind: anchor_region
        anchors: ["(?:applicant'?s? )?signature(?: of (?:the )?applicant)?"]
        placement: right       # box to the right of the label ("below" puts it under the label)
        width: 0.30
        height: 0.05
        confidence: 0.50

labels:
  - "application (?:no|number)\\.?"
  - "term"
  - "(?:loan )?term"
  - "(?:loan )?purpose(?: of loan)?"
  - "relationship(?: to applicant)?"
  - "guarantor (?:full name|id (?:number|no\\.?)|date of birth|signature|relationship)"
  - "applicant signature"
  - "guarantor signature"
  - "date of signing"
